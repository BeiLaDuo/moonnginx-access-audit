worker_processes 1;
daemon off;
master_process off;
pid logs/nginx.pid;
error_log logs/error.log notice;
events { worker_connections 32; }
http {
  access_log off;
  server_tokens off;
  server {
    listen 127.0.0.1:8080;
    server_name own.test;
    root html;
    add_header X-Frame-Options DENY always;
    include checks.conf;
  }
}
