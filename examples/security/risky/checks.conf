# Missing location slash allows /assets../private/secret.txt to escape assets.
location /assets { alias html/assets/; }
# A local add_header drops the inherited X-Frame-Options list.
location /headers/ { add_header X-Request-Trace fixture always; }
# Rewrite-phase return runs before the access-phase deny.
location /blocked/ { deny all; return 200 "PRIVATE fixture response\n"; }
location /ready/ { }
