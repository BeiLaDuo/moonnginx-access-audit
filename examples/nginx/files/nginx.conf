events {
    worker_connections 32;
}

http {
    include includes/office.conf;
    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        location / {
            root html;
        }
        location /health {
            allow 127.0.0.1;
            deny all;
            root html;
        }
    }
}
